name: arena-data-fetch

# Officially-sourced data collector for the DrugAnalysis project.
#
# The sandbox that edits this repository has no general outbound network
# access, so every external fetch is performed here, on GitHub's runner, and
# committed verbatim to the branch. Nothing is transformed or "cleaned" by the
# runner: the raw JSON/CSV/text payload returned by each official endpoint is
# written straight to data/raw/<job-id>/ together with a manifest.json that
# records the exact URL, HTTP status and fetch time, so every downstream row
# can be traced back to a primary source.
#
# Jobs are declarative: add a JSON spec under fetch_jobs/ and push it. Each
# spec is a list of {id, url, out} objects.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'fetch_jobs/**'
      - '.github/workflows/arena-data-fetch.yml'

permissions:
  contents: write

concurrency:
  group: arena-data-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run declarative fetch jobs
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name  "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          JOBS=(fetch_jobs/*.json)
          echo "job files: ${JOBS[*]:-none}"
          for job in "${JOBS[@]}"; do
            jobid=$(basename "$job" .json)
            outdir="data/raw/$jobid"
            echo "== job $jobid =="
            python3 - "$job" "$outdir" <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, hashlib, datetime

          job_path, outdir = sys.argv[1], sys.argv[2]
          specs = json.load(open(job_path))
          if isinstance(specs, dict):
              specs = [specs]
          os.makedirs(outdir, exist_ok=True)
          manifest = []
          for spec in specs:
              sid  = spec["id"]
              url  = spec["url"]
              out  = spec.get("out", f"{sid}.json")
              dest = os.path.join(outdir, out)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              if os.path.exists(dest) and os.path.getsize(dest) > 0 and spec.get("skip_existing"):
                  print(f"skip {sid} (already fetched)")
                  manifest.append({"id": sid, "url": url, "out": out, "status": "skipped-existing",
                                   "bytes": os.path.getsize(dest)})
                  continue
              req = urllib.request.Request(url, headers={
                  "User-Agent": "DrugAnalysis-Research-Bot/1.0 (open data collection; contact: repo owner)",
                  "Accept": "application/json,text/csv,text/plain,*/*",
              })
              status, body, err = None, None, None
              for attempt in range(int(spec.get("retries", 4))):
                  try:
                      with urllib.request.urlopen(req, timeout=float(spec.get("timeout", 120))) as r:
                          status = r.status
                          body = r.read()
                      break
                  except Exception as e:                       # noqa: BLE001
                      err = f"{type(e).__name__}: {e}"
                      time.sleep(3 * (attempt + 1))
              if body is None:
                  manifest.append({"id": sid, "url": url, "out": out, "status": "FAILED", "error": err,
                                   "fetched_utc": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z"})
                  print(f"FAIL {sid} {err}")
                  continue
              with open(dest, "wb") as fh:
                  fh.write(body)
              manifest.append({
                  "id": sid, "url": url, "out": out, "status": status,
                  "bytes": len(body),
                  "sha256": hashlib.sha256(body).hexdigest(),
                  "fetched_utc": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              })
              print(f"ok {sid} {status} {len(body)} bytes -> {dest}")
              time.sleep(float(spec.get("sleep", 0.4)))
          with open(os.path.join(outdir, "manifest.json"), "w") as fh:
              json.dump({"job": os.path.basename(job_path), "generated_utc":
                         datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
                         "requests": manifest}, fh, indent=2)
          PY
          done

      - name: Commit fetched raw payloads
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/raw)" ]; then
            git add data/raw
            git commit -m "data: raw official-source payloads (${{ github.run_number }})"
            git pull --rebase origin "$BRANCH" || true
            git push origin "HEAD:$BRANCH"
          else
            echo "no new raw data to commit"
          fi
