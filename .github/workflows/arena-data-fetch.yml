name: arena-data-fetch

# Officially-sourced data collector for the DrugAnalysis project.
#
# The sandbox that edits this repository has no general outbound network
# access, so every external fetch is performed here, on GitHub's runner, and
# committed verbatim to the branch. Nothing is transformed or "cleaned" into
# new facts: the payloads returned by each official endpoint are written
# straight to data/raw/<job-id>/ together with a manifest.json that records the
# exact request URL, HTTP status, byte count and SHA-256 of what was received,
# so every downstream row can be re-verified against its primary source.
#
# Jobs are declarative: add or edit a JSON spec under fetch_jobs/ and push it.
# Implementation: scripts/run_fetch_jobs.py

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'fetch_jobs/**'
      - 'scripts/run_fetch_jobs.py'
      - '.github/workflows/arena-data-fetch.yml'

permissions:
  contents: write

# v21 2026-09-19: the group used to be global ("arena-data-fetch"), so a bulk
# fetch on one branch serialised every other branch's fetch behind it (run 22
# held the queue for ~1.5h re-downloading already-committed payloads). The
# group is now per-branch: each branch still runs one fetch at a time, but
# branches no longer block each other.
concurrency:
  group: arena-data-fetch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Runner self-test (v29, zip_extract skip_existing + no-op manifests)
        run: |
          set -euo pipefail
          # v29 2026-09-22: run 33 re-downloaded the daily-updated official
          # Drugs@FDA ZIP for every landed zip_extract job and overwrote the
          # SHA-pinned window extracts, so every SHA-gated builder aborted.
          # zip_extract now honours skip_existing and a run that only produces
          # "skipped-existing" stubs leaves manifest.json byte-identical (no
          # more stub-only data commits). Exercised end-to-end through
          # run_job() against a synthetic ZIP before any real job runs.
          python3 scripts/tests/test_run_fetch_jobs_zip_skip_existing.py

      - name: Run declarative fetch jobs
        id: runjobs
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p data/raw
          JOBS=(fetch_jobs/*.json)
          echo "job files: ${JOBS[*]:-none}"
          python3 scripts/run_fetch_jobs.py "${JOBS[@]}" 2>&1 | tee data/raw/last_run.log
          exit "${PIPESTATUS[0]}"

      - name: Guard the pre-1985 era table (1980-1984 only, 91 rows)
        if: always()
        run: |
          set -euo pipefail
          # scripts/expand_pre1980_decisions.py (v15/v16 legacy) is intentionally
          # no longer run: the 1965-1979 rows live in data/pre1980_fda_decisions.csv
          # (probe-verified, richer notes), and re-appending them into the pre-1985
          # era table (run 30, 2026-09-21) broke the era-table separation. The
          # 91-row 1980-1984 shape is pinned fail-closed here and in the validator.
          python3 - << 'PY'
          import csv, sys
          rows = list(csv.DictReader(open("data/pre1985_fda_decisions.csv", newline="", encoding="utf-8-sig")))
          years = {r["year"] for r in rows}
          if len(rows) != 91 or years != {"1980", "1981", "1982", "1983", "1984"}:
              sys.exit(f"pre1985 era table drifted: {len(rows)} rows, years {sorted(years)} - "
                       "the 1965-1979 rows belong to pre1980_fda_decisions.csv; restore the 91-row file")
          print(f"pre1985 era table pinned: {len(rows)} rows, years {sorted(years)}")
          PY

      - name: Build v28 pre-1939 boundary tables + independent verifier
        if: always()
        run: |
          set -euo pipefail
          # v28 answers "what is there before the earliest year (1939)?" from
          # committed official primary sources only:
          #   * below-boundary application census (exactly NDA000004 + NDA000159
          #     in the 29,336-row official map)
          #   * boundary evidence lines (earliest official action 1939-02-09 on
          #     NDA000552; 0 rows dated 1938)
          #   * regulatory register 1902-1938, 0 recorded decisions per year
          #   * submission status census (Drugs@FDA publishes AP only - corrects
          #     the v27 claim that RE/W rows lived in the 1938-1964 register)
          # v29 2026-09-22: the runner captures from
          # fetch_jobs/drugsatfda_pre1939_census_v28.json landed (run 33) and
          # are joined: whole-table census of all 193,810 official submission
          # rows -> 1 pre-statute placeholder row (060904, dated 1900-01-01)
          # and 8 undated rows, flagged and never counted; statuses AP/TA/
          # empty only (no RE/W/CR); fifth table
          # data/pre1939_complete_table_census.csv. The builder re-hashes every
          # capture against its manifest and aborts on any status outside the
          # approval family or any row dated between the FD&C Act (1938-06-25)
          # and 1939.
          python3 scripts/build_pre1939_boundary_v28.py
          python3 scripts/verify_pre1939_boundary_v28.py
          python3 scripts/validate_data.py
          echo "v28/v29 tables built: pre-1939 boundary evidence (16 lines), application census, 1902-1938 regulatory register, submission status census, whole-table census"

      - name: Build v27 new verified 1000 + decision engine + historical
        if: always()
        run: |
          set -euo pipefail
          # v27 builds 1000 new verified 2000-2026 entries + detailed scorecards + decision engine analysis
          # All from committed payloads, no hallucinations, SHA-checked
          python3 scripts/build_1000_new_verified_v27.py
          python3 scripts/build_core_decision_engine_table_v27.py
          python3 scripts/build_fda_decision_factors_v27.py
          python3 scripts/validate_data.py
          echo "v27 tables built: 1000 new verified, decision engine analysis, detailed scorecards, pre-1938 determination, 1938-1964 full submission register"

      - name: Build v26 pre-1965 decision tables (1939-1964) + live-probe join
        if: always()
        run: |
          set -euo pipefail
          # Base build: rewrites the four v26 tables from the SHA-verified
          # payloads (fail-closed on any drift). The builder auto-joins the
          # per-row live probes when their manifest exists; rows without a
          # captured probe stay PROBE_PENDING.
          python3 scripts/build_pre1965_decisions_v26.py
          if [ -f data/raw/pre1965_row_probes_1939_1964/manifest.json ]; then
            n=$(python3 -c "import json;print(len([e for e in json.load(open('data/raw/pre1965_row_probes_1939_1964/manifest.json'))['requests'] if e.get('sha256') and e.get('status')==200]))")
            echo "v26 probe layer: $n/535 captured"
            if [ "$n" -lt 535 ]; then
              echo "v26 probe layer partial; remaining items retry on the next push (skip_existing)"
            fi
          fi
          python3 scripts/verify_pre1965_year_register_v26.py
          python3 scripts/validate_data.py

      - name: Build v23 pre-1980 action register + CRL match layer
        if: always()
        run: |
          set -euo pipefail
          required=(
            data/raw/drugsatfda_data_files_2026_09/manifest.json
            data/raw/drugsatfda_data_files_2026_09/Submissions_1965_1979.txt
            data/raw/probe/crl_page1.json
          )
          ready=true
          for f in "${required[@]}"; do test -s "$f" || ready=false; done
          if [ "$ready" = true ]; then
            python3 scripts/build_pre1980_year_register_v23.py
            python3 scripts/verify_pre1980_year_register_v23.py
            python3 scripts/build_crl_application_match_v23.py
            python3 scripts/verify_crl_application_match_v23.py
            python3 scripts/validate_data.py
          else
            echo "v23 inputs incomplete; no table write (fail-closed)"
          fi

      - name: Ingest all captured stock events
        if: always()
        run: python3 scripts/build_stock_snapshots_from_all_events.py

      - name: Commit fetched raw payloads and deterministic tables
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/raw data/*.csv)" ]; then
            git add data/raw data/*.csv
            git commit -m "data: raw official-source payloads + deterministic tables (run ${{ github.run_number }})"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "$BRANCH"; then break; fi
              sleep 5
            done
            git push origin "HEAD:$BRANCH"
          else
            echo "no new raw data to commit"
          fi
          if [ "${{ steps.runjobs.outcome }}" = "failure" ]; then
            echo "::warning::fetch step reported failure - see data/raw/last_run.log"
            exit 1
          fi
