name: arena-data-fetch

# Officially-sourced data collector for the DrugAnalysis project.
#
# The sandbox that edits this repository has no general outbound network
# access, so every external fetch is performed here, on GitHub's runner, and
# committed verbatim to the branch. Nothing is transformed or "cleaned" into
# new facts: the payloads returned by each official endpoint are written
# straight to data/raw/<job-id>/ together with a manifest.json that records the
# exact request URL, HTTP status, byte count and SHA-256 of what was received,
# so every downstream row can be re-verified against its primary source.
#
# Jobs are declarative: add or edit a JSON spec under fetch_jobs/ and push it.
# Implementation: scripts/run_fetch_jobs.py

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'fetch_jobs/**'
      - 'scripts/run_fetch_jobs.py'
      - '.github/workflows/arena-data-fetch.yml'

permissions:
  contents: write

# v21 2026-09-19: the group used to be global ("arena-data-fetch"), so a bulk
# fetch on one branch serialised every other branch's fetch behind it (run 22
# held the queue for ~1.5h re-downloading already-committed payloads). The
# group is now per-branch: each branch still runs one fetch at a time, but
# branches no longer block each other.
concurrency:
  group: arena-data-fetch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run declarative fetch jobs
        id: runjobs
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p data/raw
          JOBS=(fetch_jobs/*.json)
          echo "job files: ${JOBS[*]:-none}"
          python3 scripts/run_fetch_jobs.py "${JOBS[@]}" 2>&1 | tee data/raw/last_run.log
          exit "${PIPESTATUS[0]}"

      - name: Build verified pre-1980 Type 1 expansion when all payload blocks exist
        if: always()
        run: |
          set -euo pipefail
          required=(
            data/raw/openfda_orig_decisions_1965_1969/manifest.json
            data/raw/openfda_orig_decisions_1970_1974/manifest.json
            data/raw/openfda_orig_decisions_1975_1979/manifest.json
          )
          ready=true
          for f in "${required[@]}"; do test -s "$f" || ready=false; done
          if [ "$ready" = true ]; then
            python3 scripts/expand_pre1980_decisions.py
          else
            echo "pre-1980 payload blocks incomplete; no table write (fail-closed)"
          fi

      - name: Build v23 pre-1980 action register + CRL match layer
        if: always()
        run: |
          set -euo pipefail
          required=(
            data/raw/drugsatfda_data_files_2026_09/manifest.json
            data/raw/drugsatfda_data_files_2026_09/Submissions_1965_1979.txt
            data/raw/probe/crl_page1.json
          )
          ready=true
          for f in "${required[@]}"; do test -s "$f" || ready=false; done
          if [ "$ready" = true ]; then
            python3 scripts/build_pre1980_year_register_v23.py
            python3 scripts/verify_pre1980_year_register_v23.py
            python3 scripts/build_crl_application_match_v23.py
            python3 scripts/verify_crl_application_match_v23.py
            python3 scripts/validate_data.py
          else
            echo "v23 inputs incomplete; no table write (fail-closed)"
          fi

      - name: Ingest all captured stock events
        if: always()
        run: python3 scripts/build_stock_snapshots_from_all_events.py

      - name: Commit fetched raw payloads and deterministic tables
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/raw data/*.csv)" ]; then
            git add data/raw data/*.csv
            git commit -m "data: raw official-source payloads + deterministic tables (run ${{ github.run_number }})"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "$BRANCH"; then break; fi
              sleep 5
            done
            git push origin "HEAD:$BRANCH"
          else
            echo "no new raw data to commit"
          fi
          if [ "${{ steps.runjobs.outcome }}" = "failure" ]; then
            echo "::warning::fetch step reported failure - see data/raw/last_run.log"
            exit 1
          fi
